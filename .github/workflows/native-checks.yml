name: Native app checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Expo configuration and dependency checks
        run: npx --yes expo-doctor
        env:
          EXPO_NO_TELEMETRY: 1
      - name: Export Android bundle
        run: npm run export:android
        env:
          EXPO_NO_TELEMETRY: 1
      - name: Export iOS bundle
        run: npm run export:ios
        env:
          EXPO_NO_TELEMETRY: 1
