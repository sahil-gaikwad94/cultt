<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A09">
<title>cultured</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A09;--coal:#121211;--ash:#1b1b19;--ash2:#262522;--line:rgba(255,255,255,.11);
  --stone:#8e8b83;--mist:#b9b5aa;--bone:#EFE9DA;--paper:#FBF7EC;
  --heart:#ff5d7a;--sun:#ffd166;--ok:#9be8bf;--bad:#ff7a7a;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --glass:rgba(22,22,20,.5);
  font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--bone);color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{height:100%;background:var(--ink);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
h1,h2,h3,h4,p,ul{margin:0;padding:0}
ul{list-style:none}
svg{display:block}
::selection{background:rgba(239,233,218,.3)}

#stage{height:100%;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--ink);isolation:isolate;container-type:size}
@media (min-width:640px){
  body{background:#d9d7d1}
  #stage{padding:22px 0}
  #phone{height:min(880px,100%);border-radius:52px;border:8px solid #050505;box-shadow:0 0 0 1.5px #3a3935,0 60px 120px rgba(0,0,0,.35)}
}

/* ---------- shared surface language ---------- */
.screen{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;padding-bottom:110px;opacity:0;pointer-events:none;transition:opacity .3s;scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;pointer-events:auto}
.tint{position:absolute;left:0;right:0;top:0;height:470px;overflow:hidden;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(#000 52%,transparent);mask-image:linear-gradient(#000 52%,transparent)}
.tint .tl{position:absolute;inset:-70px -70px 0;opacity:0;transition:opacity .9s ease;filter:blur(32px) saturate(1.7) brightness(.95)}
.tint .tl.on{opacity:1}
.tint .tl>.art{position:absolute;inset:0}
.topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(14px) 20px 6px;height:62px}
.wordmark{display:flex;align-items:center;gap:8px;font-size:27px;font-weight:800;font-stretch:76%;letter-spacing:-.04em;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.25)}
.wordmark svg{width:26px;height:26px}
.hr{display:flex;gap:8px}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);flex:none;transition:transform .25s var(--spring)}
.ibtn svg{width:20px;height:20px}
.ibtn:active{transform:scale(.88)}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.16)}
.chipg{height:27px;padding:0 12px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);color:var(--bone);white-space:nowrap}
.chipg svg{width:13px;height:13px}
.pillb{height:42px;padding:0 16px 0 10px;border-radius:21px;display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);transition:transform .25s var(--spring)}
.pillb:active{transform:scale(.94)}
.pillb svg{width:18px;height:18px}
.orb{--s:44px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s)*.4);color:#14100c;flex:none;letter-spacing:-.02em}
.art{position:absolute;inset:0;overflow:hidden}
.art>svg{position:absolute;inset:0;width:100%;height:100%}
.art::after{content:'';position:absolute;inset:0;background-image:var(--grain);background-size:200px;mix-blend-mode:overlay;opacity:.5;pointer-events:none}
.shade{position:absolute;inset:auto 0 0 0;height:64%;background:linear-gradient(transparent,rgba(6,6,5,.86));pointer-events:none}
.tintless{background:var(--ink)}

/* entrance choreography */
.enter .stg,.page.in .stg{animation:stg .85s var(--ease) both;animation-delay:calc(var(--d,0)*75ms + 60ms)}
@keyframes stg{from{opacity:0;transform:translateY(22px)}}
.fadein{animation:fadein .6s var(--ease) both}
@keyframes fadein{from{opacity:0;transform:translateY(12px) scale(.985)}}

/* ---------- floating nav ---------- */
#nav{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:32px;background:rgba(14,14,13,.72);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(0,0,0,.55);z-index:10;transition:transform .5s var(--ease),opacity .4s}
#nav.hide{transform:translate(-50%,120px);opacity:0}
.nv{position:relative;height:50px;min-width:50px;padding:0 14px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:0;color:var(--stone);border:1px solid transparent;transition:background .4s,color .3s,border-color .4s,padding .5s var(--ease),gap .5s var(--ease)}
.nv svg{width:23px;height:23px;flex:none}
.nv span.l{max-width:0;overflow:hidden;opacity:0;white-space:nowrap;font-weight:700;font-size:14px;transition:max-width .55s var(--ease),opacity .35s}
.nv.on{color:var(--bone);background:rgba(255,255,255,.09);border-color:rgba(239,233,218,.55);gap:8px;padding:0 16px 0 14px}
.nv.on span.l{max-width:80px;opacity:1}
.nv:active{transform:scale(.94)}
.badge{position:absolute;top:3px;right:3px;min-width:18px;height:18px;border-radius:9px;background:var(--bone);color:#141413;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;animation:pop2 .5s var(--spring)}
@keyframes pop2{from{transform:scale(0)}}

/* ---------- folder tabs + sheet ---------- */
.ftabs{position:relative;z-index:3;display:flex;align-items:flex-end;height:48px;padding:0 34px}
.ft{position:relative;z-index:2;height:46px;padding:0 17px;font-size:15.5px;font-weight:600;color:rgba(255,255,255,.78);text-shadow:0 1px 10px rgba(0,0,0,.3);transition:color .3s;white-space:nowrap}
.ft.on{color:var(--bone);text-shadow:none}
.fblob{position:absolute;bottom:0;height:46px;background:var(--ink);border-radius:23px 23px 0 0;z-index:1}
.fblob.ready{transition:left .55s var(--ease),width .55s var(--ease)}
.fblob::before,.fblob::after{content:'';position:absolute;bottom:0;width:23px;height:23px}
.fblob::before{left:-23px;background:radial-gradient(circle at 0 0,transparent 22.5px,var(--ink) 23px)}
.fblob::after{right:-23px;background:radial-gradient(circle at 100% 0,transparent 22.5px,var(--ink) 23px)}
.sbody{position:relative;z-index:2;background:var(--ink);border-radius:32px 32px 0 0;margin-top:-1px;min-height:calc(100cqh - 62px - 48px)}
.drow{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 22px 4px}
.bigdate{display:flex;font-size:78px;font-weight:800;font-stretch:75%;letter-spacing:-.05em;line-height:.88;color:var(--bone)}
.bigdate .ch{display:inline-block;overflow:hidden;height:.9em;vertical-align:top}
.bigdate .ch i{display:block;font-style:normal;animation:roll .9s var(--ease) both;animation-delay:calc(var(--d)*55ms)}
.bigdate .sp2{width:.22em}
@keyframes roll{from{transform:translateY(108%) rotate(6deg)}}
.cnt{height:30px;padding:0 13px;border-radius:15px;display:inline-flex;align-items:center;font-size:13.5px;font-weight:700;border:1px solid rgba(239,233,218,.4);color:var(--bone);margin-bottom:6px;font-variant-numeric:tabular-nums}

/* ---------- deck ---------- */
.deck{position:relative;margin:0 20px;height:max(420px,calc(100cqh - 62px - 48px - 112px - 104px));perspective:1300px}
.dcard{--k:0;position:absolute;inset:36px 0 0 0;border-radius:32px;overflow:hidden;background:var(--coal);touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;
  transform:translateY(calc(var(--k)*-17px)) scale(calc(1 - var(--k)*.055));transform-origin:50% 0;opacity:calc(1 - var(--k)*.12);
  transition:transform .65s var(--ease),opacity .5s;box-shadow:0 24px 50px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.07)}
.dcard::before{content:'';position:absolute;inset:0;z-index:3;background:#000;opacity:calc(var(--k)*.42);pointer-events:none;transition:opacity .5s}
.dcard.far{opacity:0;pointer-events:none}
.dcard:not(.top) .acol,.dcard:not(.top) .dc-bot,.dcard:not(.top) .dc-top{opacity:0}
.dc-top,.dc-bot,.acol{transition:opacity .4s}
.dc-top{position:absolute;left:16px;right:16px;top:16px;display:flex;gap:8px;z-index:2;align-items:center}
.dc-bot{position:absolute;left:18px;right:84px;bottom:20px;z-index:2}
.dc-bot h3{font-size:36px;font-weight:800;font-stretch:76%;letter-spacing:-.035em;line-height:.95}
.dc-bot p{margin-top:8px;color:rgba(255,255,255,.82);font-size:15px;line-height:1.35}
.dcard .eqb{margin-left:auto}
.eqb{display:flex;gap:3px;align-items:center;height:27px;padding:0 11px;border-radius:99px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);opacity:0;transition:opacity .3s}
.eqb i{width:3px;height:5px;border-radius:2px;background:#fff;display:block}
.playing .eqb{opacity:1}
.playing .eqb i{animation:eq .8s ease-in-out infinite alternate}
.eqb i:nth-child(2){animation-delay:-.3s!important}.eqb i:nth-child(3){animation-delay:-.6s!important}.eqb i:nth-child(4){animation-delay:-.15s!important}
@keyframes eq{from{height:4px}to{height:15px}}
.playp,.glassb{margin-top:14px;height:44px;padding:0 18px 0 14px;border-radius:22px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;background:rgba(239,233,218,.95);color:#141413;transition:transform .25s var(--spring)}
.glassb{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--bone);border:1px solid rgba(255,255,255,.22);margin:0}
.playp:active,.glassb:active{transform:scale(.94)}
.playp svg,.glassb svg{width:18px;height:18px;fill:currentColor;stroke:none}
.playp .i-pause,.glassb .i-pause{display:none}
.playing .playp .i-play,.playing .glassb .i-play{display:none}
.playing .playp .i-pause,.playing .glassb .i-pause{display:block}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.14);z-index:4}
.prog i{display:block;height:100%;width:0;background:var(--bone);transition:width .25s linear}
.acol{position:absolute;right:12px;bottom:18px;display:flex;flex-direction:column;gap:11px;align-items:center;z-index:5}
.rb{position:relative;display:flex;align-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.acol .rb{flex-direction:column;gap:3px}
.acol .rb .ri{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);transition:transform .3s var(--spring),background .3s,color .3s,border-color .3s}
.ri svg{width:22px;height:22px;transition:transform .4s var(--spring)}
.rb:active .ri{transform:scale(.86)}
.rb.like.on .ri{background:rgba(255,93,122,.2);border-color:rgba(255,93,122,.6);color:var(--heart)}
.rb.like.on svg{fill:currentColor;transform:scale(1.15)}
.rb.laugh.on .ri{background:rgba(255,209,102,.2);border-color:rgba(255,209,102,.6);color:var(--sun)}
.rb.laugh.on svg circle{fill:var(--sun)}
.rb.laugh.on svg path{stroke:#2b1a00}
.rb.laugh.on svg .m{fill:#2b1a00}
.rb.laugh.on svg{transform:rotate(-10deg) scale(1.12)}
.rb.save.on .ri{background:rgba(239,233,218,.95);color:#141413;border-color:transparent}
.rb.save.on svg{fill:currentColor}
.rb .n{font-size:12px;color:rgba(255,255,255,.88)}
.arow{display:flex;align-items:center;gap:8px}
.arow .rb{height:44px;padding:0 15px 0 12px;border-radius:22px;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:14.5px;transition:background .3s,color .3s,border-color .3s,transform .25s var(--spring)}
.arow .rb:active{transform:scale(.94)}
.arow .rb .ri{width:auto;height:auto;border:0;background:none;display:grid}
.arow .rb.like.on{background:rgba(255,93,122,.14);border-color:rgba(255,93,122,.5);color:var(--heart)}
.arow .rb.laugh.on{background:rgba(255,209,102,.13);border-color:rgba(255,209,102,.5);color:var(--sun)}
.arow .rb.save.on{background:rgba(239,233,218,.95);border-color:transparent}
.arow .rb .n{color:inherit}
.arow .sp{flex:1}
.arow .rb.icon{padding:0;width:44px;justify-content:center}
.bp{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none}
.bigheart{position:absolute;left:50%;top:44%;width:120px;height:120px;margin:-60px 0 0 -60px;color:var(--heart);pointer-events:none;z-index:8;animation:bh 1s var(--ease) forwards;filter:drop-shadow(0 10px 30px rgba(255,93,122,.5))}
.bigheart svg{width:100%;height:100%;fill:currentColor;stroke:none}
@keyframes bh{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}60%{transform:scale(1)}100%{transform:scale(1.35) translateY(-40px);opacity:0}}
.memeart{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;justify-content:flex-start}
.memeart .sticker{position:absolute;right:-28px;top:54px;width:150px;height:150px;animation:spin 40s linear infinite}
.mtxt{position:relative;margin-top:44px;font-size:var(--ms,34px);line-height:.98;font-weight:800;font-stretch:76%;letter-spacing:-.035em;white-space:pre-line;max-width:86%}
.mtag{position:absolute;left:22px;bottom:20px;font-size:13px;font-weight:700;letter-spacing:-.01em;opacity:.7}
.dcard .memeart .mtxt{--ms:40px}
@keyframes spin{to{transform:rotate(360deg)}}

/* circles feed */
.circles{position:relative;z-index:2;background:var(--ink);padding:6px 0 10px}
.sec{font-size:26px;font-weight:800;font-stretch:78%;letter-spacing:-.03em;padding:26px 22px 14px}
.cc{margin:0 20px 22px}
.cc-art{position:relative;aspect-ratio:4/4.6;border-radius:30px;overflow:hidden;background:var(--coal);cursor:pointer;border:1px solid rgba(255,255,255,.07)}
.cc-art .memeart .mtxt{--ms:31px}
.cc-by{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:99px;z-index:2;font-size:13.5px}
.cc-by .orb{--s:30px}
.cc-bot{position:absolute;left:18px;right:18px;bottom:18px;z-index:2}
.cc-bot h3{font-size:30px;font-weight:800;font-stretch:76%;letter-spacing:-.03em;line-height:.96}
.cc-bot p{margin-top:6px;color:rgba(255,255,255,.8);font-size:14.5px}
.cc .arow{margin-top:12px}
.ptr{position:absolute;left:50%;top:84px;width:30px;height:30px;margin-left:-15px;color:var(--bone);opacity:0;pointer-events:none;z-index:6}
.ptr.spin svg{animation:spin 1s linear infinite}
#feedBody.fresh{animation:fadein .7s var(--ease)}
.tm{padding:12px 22px 24px;text-align:center}
.tm-cards{position:relative;height:300px;margin:6px 0 14px}
.tmc{position:absolute;left:50%;top:0;width:200px;height:290px;margin-left:-100px;border-radius:28px;background:linear-gradient(160deg,#2b2a26,#121211);border:1px solid var(--line);display:grid;place-items:center;font-size:70px;font-weight:800;font-stretch:75%;color:rgba(255,255,255,.14);transform:translateX(var(--x,0)) rotate(var(--r,0));animation:float 5s ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes float{to{transform:translateX(var(--x,0)) translateY(-10px) rotate(calc(var(--r,0) * 1.3))}}
.tm h2{font-size:32px;font-weight:800;font-stretch:76%;letter-spacing:-.035em}
.tm .hint{margin-top:8px}
.cd{font-size:56px;font-weight:800;font-stretch:75%;letter-spacing:-.04em;margin:16px 0 14px;font-variant-numeric:tabular-nums}
.hint{color:var(--mist);font-size:14.5px;line-height:1.45}
.hint b{color:var(--bone)}

/* ---------- detail pages ---------- */
#pages{position:absolute;inset:0;z-index:20;pointer-events:none}
.page{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;overflow:hidden;transform:translateX(102%);transition:transform .55s var(--ease),opacity .45s;pointer-events:auto}
.page.in{transform:none}
.page.fade{transform:scale(.96);opacity:0}
.page.fade.in{transform:none;opacity:1}
.page>*{position:relative;z-index:1}
.page>.tint{position:absolute;z-index:0}
.page-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;flex:none}
.page-seg{padding:0 16px 12px;flex:none}
.page-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:40px;scrollbar-width:none}
.page-body::-webkit-scrollbar{display:none}
.ph-t{flex:1;min-width:0}
.ph-t b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-t span{display:block;color:var(--mist);font-size:13px;margin-top:1px}
.d-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 130px;scrollbar-width:none}
.d-scroll::-webkit-scrollbar{display:none}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.d-chips{display:flex;gap:6px}
.d-hero{position:relative;aspect-ratio:1/1.02;border-radius:32px;overflow:hidden;background:var(--coal);box-shadow:0 30px 70px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08)}
.d-hero .memeart .mtxt{--ms:38px}
.d-hero .glassb{position:absolute;right:14px;bottom:14px;z-index:3}
.d-hero .eqb{position:absolute;left:14px;bottom:20px;z-index:3}
.d-title{margin-top:22px;font-size:40px;font-weight:800;font-stretch:76%;letter-spacing:-.04em;line-height:.95}
.d-by{margin-top:6px;color:var(--mist);font-size:16px}
.d-scroll .arow{margin-top:18px;flex-wrap:nowrap}
.d-desc{margin-top:20px;color:#d6d1c4;font-size:15.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.d-desc.open{-webkit-line-clamp:unset;display:block}
.readm{margin-top:6px;font-weight:700;font-size:14.5px;text-decoration:underline;text-underline-offset:4px}
.d-h{font-size:24px;font-weight:800;font-stretch:80%;letter-spacing:-.025em;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.d-h small{font-size:14px;color:var(--mist);font-weight:500;letter-spacing:0}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.crew-c{flex:none;width:116px}
.crew-c .pt{position:relative;aspect-ratio:3/4;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.crew-c .pt .fpmini{position:absolute;inset:-18%;opacity:.8}
.crew-c .pt .fpmini svg{width:100%;height:100%;overflow:visible}
.crew-c .pt b{position:absolute;left:12px;bottom:6px;font-size:54px;font-weight:800;font-stretch:75%;letter-spacing:-.05em;color:rgba(255,255,255,.92);line-height:1}
.crew-c p{margin-top:9px;font-size:14.5px;font-weight:700}
.crew-c span{display:block;color:var(--mist);font-size:12.5px;margin-top:1px}
.cm-list{display:flex;flex-direction:column;gap:14px}
.cm{display:flex;gap:10px;align-items:flex-start}
.cm .orb{--s:32px}
.cm b{font-size:14px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}

/* ---------- settings ---------- */
.group{margin:12px 20px 0;border-radius:28px;background:var(--ash);border:1px solid var(--line);overflow:hidden}

.title{font-size:34px;font-weight:800;font-stretch:78%;letter-spacing:-.035em;line-height:1}

/* ---------- splash + onboarding ---------- */
#splash{position:absolute;inset:0;z-index:90;background:var(--ink);display:grid;place-items:center;transition:opacity .7s ease .1s}

.ob-hero{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 24px}
.fan{position:absolute;left:0;right:0;top:34px;height:330px}
.fan .oc{position:absolute;left:50%;top:0;width:190px;height:270px;margin-left:-95px;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);transform:translateX(var(--x)) rotate(var(--r));animation:fanin 1.1s var(--ease) both,bob 6s ease-in-out infinite alternate;animation-delay:calc(var(--d)*120ms),calc(1.2s + var(--d)*300ms)}

.ob-h{font-size:60px;font-weight:800;font-stretch:75%;letter-spacing:-.05em;line-height:.91}

.ob-s{margin-top:10px;color:var(--mist);font-size:16px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px;height:min(440px,52cqh)}
.opt{position:relative;flex:1;border-radius:30px;overflow:hidden;text-align:left;border:1px solid rgba(255,255,255,.1);transition:flex .7s var(--ease),transform .3s var(--spring)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* v3 motion + memes */
#phone::before{content:'';position:absolute;inset:-20%;z-index:0;pointer-events:none;opacity:.5;background:radial-gradient(40% 30% at 20% 20%,rgba(255,93,122,.22),transparent 70%),radial-gradient(35% 30% at 80% 60%,rgba(255,209,102,.16),transparent 70%),radial-gradient(40% 35% at 30% 90%,rgba(155,232,191,.14),transparent 70%);animation:aur 18s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(6%,-5%) rotate(8deg) scale(1.15)}}
#onboard.on{background-image:radial-gradient(50% 35% at 15% 10%,rgba(255,93,122,.3),transparent 70%),radial-gradient(50% 40% at 90% 70%,rgba(255,209,102,.22),transparent 70%);background-size:160% 160%;animation:aurBg 9s ease-in-out infinite alternate}
@keyframes aurBg{to{background-position:100% 80%}}
.ob-hero{position:relative}.stks{position:absolute;inset:0;pointer-events:none;z-index:4}
.stks i{position:absolute;left:var(--x);top:var(--y);font-style:normal;font-size:34px;animation:flt 4.5s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.8s);filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}

.mm-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 20px 14px;scrollbar-width:none}.mm-row::-webkit-scrollbar{display:none}
.mm-card{flex:none;width:78%;aspect-ratio:1/1.08;scroll-snap-align:center;border-radius:28px;padding:22px;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);position:relative;overflow:hidden;animation:mmin .7s var(--spring) both;animation-delay:calc(var(--i)*70ms);box-shadow:0 18px 40px rgba(0,0,0,.4);transition:transform .3s var(--spring)}

.mm-bar{display:flex;align-items:center;gap:6px}.mm-bar .sp{flex:1}.mm-k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.6}
.mm-b{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,19,.1);color:var(--fg);transition:transform .25s var(--spring),background .3s}
.mm-b svg{width:19px;height:19px}.mm-b:active{transform:scale(.8)}.mm-b.on{background:#141413;color:var(--bg)}
.mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:52vh;overflow:auto}
.mm-mini{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:18px;background:var(--bg);color:var(--fg);font-size:13px;font-weight:700;line-height:1.2;min-height:96px;flex:none;width:150px}

.calm .mm-card,.calm .stks i,.calm #phone::before{animation:none!important}

function fpSVG(P,c1,c2,o){
  o=o||{};const n=o.n||15,w=o.w||1.5;let out='';
  for(let i=0;i<n;i++){
    const f=i/(n-1),base=12+f*70,amp=.8+f*6.4,cx=100+(P.d-.5)*f*14,cy=100+(P.a[2]-.5)*f*12;let d='';

      d+=(k?'L':'M')+(cx+rr*Math.cos(t)).toFixed(1)+' '+(cy+rr*Math.sin(t)).toFixed(1);
    }
    out+=`<path class="fp-ring" pathLength="1" d="${d}Z" stroke="${mixc(c1,c2,f)}" stroke-width="${w}" opacity="${(.95-f*.42).toFixed(2)}" style="--i:${i}"/>`;

}

/* swipe + tap + double tap, shared by every deck */
function bindDrag(card,o){
  let x0=0,y0=0,dx=0,t0=0,drag=false,moved=false,last=0;
  card.addEventListener('pointerdown',e=>{if(!o.can()||e.target.closest('button'))return;drag=true;moved=false;x0=e.clientX;y0=e.clientY;dx=0;t0=Date.now();card.style.transition='none';try{card.setPointerCapture(e.pointerId)}catch(_){}});
  card.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-x0;const dy=e.clientY-y0;if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;card.style.transform=`translate3d(${dx}px,${dy*.15}px,0) rotate(${dx/18}deg) rotateY(${dx/40}deg)`;if(o.drag)o.drag(dx)});
  const end=()=>{
    if(!drag)return;drag=false;card.style.transition='';
    if(Math.abs(dx)>110){o.fly(dx>0?1:-1)}
    else{
      card.style.transform='';if(o.drag)o.drag(0);
      if(!moved&&Date.now()-t0<350){const n=Date.now();if(n-last<320){last=0;if(o.dbl)o.dbl()}else{last=n;setTimeout(()=>{if(last===n){last=0;if(o.tap)o.tap()}},320)}}
    }
  };
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
}

/* ================= listening room (the "seat map") ================= */
const SEATROWS=[8,'s','s','s','s',0,'s','s'];
function openRoom(o){
  const t=TRACKS[o.trackId]||TRACKS.moons;
  const friends=PEOPLE.filter(p=>p.matched||S.matchedIds.indexOf(p.id)>-1);
  const R=ROOM={t:t,w:(o.withId&&person(o.withId))?o.withId:friends[0].id,friends:friends.map(f=>f.id),n:2,slot:'Now',day:0,room:0,sel:[],live:{},iv:null};
  const pg=openPage(`<div class="rm-top"><button class="ibtn" data-act="back" aria-label="Back">${I.back}</button><div class="rm-t"><b>${esc(t.title)}</b><button data-act="room-who" aria-label="Change who you listen with"><span id="rWith"></span>${I.chevd}</button></div><span style="width:42px"></span></div>
    <div class="page-body" style="padding-bottom:110px">
    <div class="rm-pills stg"><button class="rpill" data-act="room-day" aria-label="Change day"><span id="rDay">Today</span>${I.chevd}</button><div class="rpill sel2"><button class="stp" data-act="seats-dec" aria-label="Fewer seats">${I.minus}</button><span id="rN">2 Seats</span><button class="stp" data-act="seats-inc" aria-label="More seats">${I.plus}</button></div></div>
    <div class="rm-loc stg" style="--d:1"><button data-act="room-name" aria-label="Change room">${I.pin}<div><b id="rName"></b><span id="rLive"></span></div>${I.chevd}</button></div>
    <div class="rscreen stg" style="--d:2;--glow:${t.pal[1]}88"><div>${poster(t,true)}</div></div>
    <div class="seats stg" style="--d:3" id="seats"></div>
    <div class="rm-slots stg" style="--d:4"><h4>Select slot</h4><div class="slots" id="slots"></div></div>
    </div>
    <div class="cta-dock"><button class="split" id="rGo" data-act="room-go"><b></b><span></span></button></div>`);
  pg.dataset.room='1';setTint(pg,poster(t,true));
  pg.onclose=()=>{clearInterval(R.iv);ROOM=null};
  roomSeed();drawRoom();
  R.iv=setInterval(()=>{const live=$$('#seats .seat.live');if(!live.length)return;const s=live[Math.floor(Math.random()*live.length)];const e=document.createElement('i');e.className='pop';e.textContent=EMO[Math.floor(Math.random()*EMO.length)];s.appendChild(e);setTimeout(()=>e.remove(),1900)},1500);
  haptic(8);
}
function roomSeed(){
  const R=ROOM,r=rng(hash(R.t.id)+R.room*77+R.day*13),names=['Kai','Ines','Dev','Mara','Jo','Theo','Priya','Sol','Nina','Omar'];R.live={};
  let k=0;while(Object.keys(R.live).length<(R.day?4:10)&&k++<200){const row=1+Math.floor(r()*7),col=Math.floor(r()*8);if(SEATROWS[row]===0)continue;R.live[row+'-'+col]=names[Math.floor(r()*names.length)]}
  R.sel=[];
  for(let c=0;c<7&&R.sel.length<R.n;c++){const a=3+'-'+c,b=3+'-'+(c+1);if(!R.live[a]&&!R.live[b]&&c!==3){R.sel=[a,b].slice(0,R.n);break}}
}
const SLOTS=[['Now','8:30 PM','10:00 PM','11:30 PM'],['9:00 AM','12:30 PM','6:00 PM','9:30 PM']];
function drawRoom(){
  const R=ROOM;if(!R)return;
  const rows=SEATROWS.map((cfg,row)=>{
    if(cfg===0)return '<div class="srow gap"></div>';
    const cols=[];for(let c=0;c<8;c++){
      const id=row+'-'+c,st=R.sel.indexOf(id)>-1?'mine':R.live[id]?'live':'';
      if(row>0&&c===4)cols.push('<span class="aisle"></span>');
      cols.push(`<button class="seat ${st}" style="--dl:${(c*.3+row*.2).toFixed(1)}s" data-act="seat" data-id="${id}" aria-label="Seat ${row+1}-${c+1}${R.live[id]?', '+R.live[id]+' is listening':st==='mine'?', yours':''}">${SEAT}</button>`);
    }
    return `<div class="srow">${cols.join('')}</div>`;
  });
  $('#seats').innerHTML=rows.join('');
  $('#rWith').textContent='with '+person(R.w).name;$('#rDay').textContent=R.day?'Tomorrow':'Today';
  $('#rN').textContent=R.n+(R.n===1?' Seat':' Seats');$('#rName').textContent=ROOMS[R.room];$('#rLive').textContent=Object.keys(R.live).length+' listening now';
  const sl=SLOTS[R.day];if(sl.indexOf(R.slot)<0)R.slot=sl[0];
  $('#slots').innerHTML=sl.map(s=>`<button class="slot ${s===R.slot?'on':''}" data-act="slot" data-s="${s}">${s}</button>`).join('');
  paintGo();
}
function paintGo(){
  const R=ROOM,btn=$('#rGo'),ok=R.sel.length===R.n,now=R.slot==='Now';
  $('b',btn).textContent=ok?(now?'Start listening':'Send invite'):'Pick '+R.n+(R.n===1?' seat':' seats');
  $('span',btn).textContent=now?'15 min':R.slot;btn.disabled=!ok;
}
ACT.seat=b=>{
  const R=ROOM,id=b.dataset.id;
  if(R.live[id]){toast(R.live[id]+' is already here');haptic(6);return}
  const i=R.sel.indexOf(id);
  if(i>-1)R.sel.splice(i,1);else{R.sel.push(id);if(R.sel.length>R.n)R.sel.shift()}
  haptic(8);$$('#seats .seat').forEach(s=>s.classList.toggle('mine',R.sel.indexOf(s.dataset.id)>-1));paintGo();
};
ACT['seats-inc']=()=>{const R=ROOM;if(R.n<4){R.n++;haptic(6);$('#rN').textContent=R.n+' Seats';paintGo()}};
ACT['seats-dec']=()=>{const R=ROOM;if(R.n>1){R.n--;while(R.sel.length>R.n)R.sel.shift();haptic(6);drawRoom()}};
ACT['room-day']=()=>{const R=ROOM;R.day=R.day?0:1;R.slot=SLOTS[R.day][0];roomSeed();drawRoom();haptic(6)};
ACT['room-name']=()=>{const R=ROOM;R.room=(R.room+1)%ROOMS.length;roomSeed();drawRoom();haptic(6)};
ACT['room-who']=()=>{const R=ROOM,i=R.friends.indexOf(R.w);R.w=R.friends[(i+1)%R.friends.length];$('#rWith').textContent='with '+person(R.w).name;haptic(6)};
ACT.slot=b=>{ROOM.slot=b.dataset.s;$$('#slots .slot').forEach(s=>s.classList.toggle('on',s===b));paintGo();haptic(5)};
ACT['room-go']=()=>{
  const R=ROOM;if(!R||R.sel.length!==R.n)return;
  const w=R.w,t=R.t,now=R.slot==='Now',slot=R.slot,day=R.day;
  if(now){closePage();setTimeout(()=>openSession(w,t,R.n),520)}
  else{
    ensureThread(w);S.threads[w].msgs.push({f:'me',t:`Listening invite: ${t.title}, ${day?'tomorrow ':''}${slot}`,ts:Date.now()});save();closePage();toast(`Invite sent to ${person(w).name} for ${slot}`);haptic([10,30,10]);reply(w);
  }
};

/* ================= co-listening session ================= */
function openSession(id,track,seats){
  const p=person(id),others=Object.values(TRACKS).filter(x=>x.id!==track.id);
  const Q=[track,others[0],others[1]];
  const L=SES={id:id,p:p,Q:Q,remaining:900,i:0,pos:38,playing:true,moments:[],played:1,done:false,iv:null,guests:Math.max(0,(seats||2)-2)};
  const extras=['kai','dev','ines'].filter(x=>x!==id).slice(0,L.guests);
  const pg=openPage(`<div class="page-head"><button class="ibtn" data-act="back" aria-label="Leave session">${I.back}</button><div class="ph-t"><b>Listening with ${esc(p.name)}</b><span>Shared 15-minute session</span></div></div>
    <div class="page-body ses" id="ses"><div class="ses-fx" id="sfx"></div>
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.6"/><circle id="sArc" cx="50" cy="50" r="47" fill="none" stroke="url(#grad)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="295.3" stroke-dashoffset="0"/></svg><div class="cover" id="sCover"></div></div>
      <div class="guests"><span class="orb" style="--s:32px;background:#EFE9DA">You</span>${orb(p,32)}${extras.map(x=>orb(person(x),32)).join('')}<span>${2+L.guests} listening</span></div>
      <div class="clock"><b id="sTime">15:00</b><span>left in this session</span></div>
      <div class="np"><h3 id="sTitle"></h3><p id="sArtist"></p></div>
      <div class="tl-wrap"><div class="mks" id="mks"></div><div class="tl" id="tl">${Array.from({length:56},(_,k)=>`<i style="height:${Math.round(10+Math.abs(Math.sin(k*1.3)*.6+Math.sin(k*.37+1)*.4)*44)}px"></i>`).join('')}</div><div class="tl-t"><span id="sPos">0:00</span><span id="sLen">0:00</span></div></div>
      <div class="emo" role="group" aria-label="Pin a moment">${EMO.map(e=>`<button data-act="moment" data-e="${e}" aria-label="Pin ${e}">${e}</button>`).join('')}</div>
      <div class="mom" id="sMom"></div>
      <div class="ses-ctl"><button class="cbtn" data-act="s-play" id="sPlay" aria-label="Pause">${I.pause}</button><button class="end-btn" data-act="s-end">End session</button></div>
    </div>`);
  pg.dataset.ses='1';
  pg.onclose=()=>{clearInterval(L.iv);L.done=true;SES=null;const t=$(`.page[data-thread="${id}"]`);if(t)renderMsgs(id)};
  sesTrack();sesPaint();sesMoments();
  L.iv=setInterval(sesTick,1000);haptic([10,30,10]);
}
function sesTrack(){
  const L=SES;if(!L)return;const t=L.Q[L.i],pg=$('.page[data-ses]');
  $('#sCover').innerHTML=poster(t,true);$('#sTitle').textContent=t.title;$('#sArtist').textContent=t.artist;$('#sLen').textContent=fmt(t.len);
  setTint(pg,poster(t,true));sesMarkers();
}
function sesPaint(){
  const L=SES;if(!L)return;const t=L.Q[L.i];
  $('#sTime').textContent=fmt(Math.max(0,L.remaining));
  $('#sArc').setAttribute('stroke-dashoffset',(295.3*(1-L.remaining/900)).toFixed(1));
  $('#sPos').textContent=fmt(L.pos);
  const k=Math.floor(L.pos/t.len*56);$$('#tl i').forEach((b,i)=>b.classList.toggle('p',i<k));
}
function sesMarkers(){
  const L=SES;if(!L)return;const t=L.Q[L.i];
  $('#mks').innerHTML=L.moments.filter(m=>m.i===L.i).map(m=>{const c=m.fresh?'mk new':'mk';m.fresh=false;return `<span class="${c}" style="left:${(m.pos/t.len*100).toFixed(1)}%">${m.e}</span>`}).join('');
}
function sesMoments(){
  const L=SES;if(!L)return;
  $('#sMom').innerHTML=L.moments.length?L.moments.slice(-5).reverse().map(m=>`<span class="mc"><b>${fmt(m.pos)}</b>${m.e} ${m.by==='me'?'You':esc(L.p.name)}</span>`).join(''):'Tap an emoji to pin a moment to the song.';
}
function floatEmoji(e,fromBtn){
  const fx=$('#sfx');if(!fx||S.set.calm)return;
  const el=document.createElement('span');el.className='fe';el.textContent=e;
  const x=fromBtn?(fromBtn.getBoundingClientRect().left-fx.getBoundingClientRect().left+14):(30+Math.random()*(fx.offsetWidth-90));
  el.style.left=x+'px';fx.appendChild(el);
  const dr=(Math.random()-.5)*80;
  el.animate([{transform:'translate(0,0) scale(.5)',opacity:0},{transform:`translate(${dr*.4}px,-90px) scale(1.2)`,opacity:1,offset:.25},{transform:`translate(${dr}px,-380px) scale(1)`,opacity:0}],{duration:2200,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>el.remove();
}
function addMoment(e,by,btn){
  const L=SES;if(!L||L.done)return;L.moments.push({e:e,pos:L.pos,i:L.i,by:by,fresh:true});sesMarkers();sesMoments();floatEmoji(e,by==='me'?btn:null);if(by==='me')haptic(10);
}
function sesTick(){
  const L=SES;if(!L||L.done)return;
  L.remaining--;
  if(L.playing){
    L.pos++;const t=L.Q[L.i];
    if(L.pos>=t.len){L.i=(L.i+1)%L.Q.length;L.pos=0;L.played++;sesTrack()}
    else if(Math.random()<.15)addMoment(EMO[Math.floor(Math.random()*EMO.length)],'them');
  }
  sesPaint();if(L.remaining<=0)sesEnd();
}
ACT.moment=b=>addMoment(b.dataset.e,'me',b);
ACT['s-play']=b=>{const L=SES;if(!L)return;L.playing=!L.playing;b.innerHTML=L.playing?I.pause:I.play;b.setAttribute('aria-label',L.playing?'Pause':'Play');$('#ses').classList.toggle('paused',!L.playing);haptic(6)};
function sesEnd(){
  const L=SES;if(!L||L.done)return;L.done=true;clearInterval(L.iv);
  const pg=$('.page[data-ses]');const o=document.createElement('div');o.className='ses-end';
  o.innerHTML=`<div class="ok">${I.check}</div><h2>That’s your 15 minutes</h2><p>The session is over. Your chat with ${esc(L.p.name)} is still open.</p><div class="recap"><div><b>${L.moments.length}</b><span>moments pinned</span></div><div><b>${L.played}</b><span>${L.played===1?'song':'songs'} played</span></div></div><button class="cta" data-act="s-recap">Share moments in chat</button><button class="cta ghostb" data-act="back">Back to chat</button>`;
  pg.appendChild(o);haptic([20,60,20]);
}
ACT['s-end']=sesEnd;
ACT['s-recap']=()=>{
  const L=SES;if(!L)return;const id=L.id;ensureThread(id);
  const txt=L.moments.length?`We listened together for 15 minutes. Moments: ${L.moments.map(m=>m.e+' '+fmt(m.pos)).join(', ')}`:'We listened together for 15 minutes.';
  S.threads[id].msgs.push({f:'me',t:txt,ts:Date.now()});save();closePage();
};

/* ================= you (Cultural Fingerprint) ================= */
function renderYou(){
  const pr=S.prof,mine=fpParams(mineSeed());
  const saved=Object.keys(S.react).filter(id=>S.react[id].s&&POSTS[id]);
  const laughs=Object.keys(S.react).filter(id=>S.react[id].h).length;

 {id:'x8',k:'life',e:'🏋️',t:'gym: 5 min\nstretching: 3 min\nresting on my phone: 55 min',bg:'#F2D45C',fg:'#141413'},
 {id:'x9',k:'life',e:'☕',t:'me: i’m so low maintenance\n\nalso me: a 4-step coffee order',bg:'#EFE9DA',fg:'#141413'},
 {id:'x10',k:'life',e:'🍳',t:'me: i’m basically a chef\n\nthe smoke alarm: respectfully, no',bg:'#F26B4E',fg:'#141413'}];
let mmTab='all';
const mmS=()=>S.mm||(S.mm={l:{},s:{}});
const mmOf=id=>MM.find(m=>m.id===id);
const mmList=()=>mmTab==='all'?MM:MM.filter(m=>m.k===mmTab);
const mmTxt=t=>esc(t).replace(/\n/g,'<br>');
function mmCard(m,i){const st=mmS();return `<article class="mm-card" data-m="${m.id}" style="--bg:${m.bg};--fg:${m.fg};--i:${i}"><span class="mm-e">${m.e}</span><p>${mmTxt(m.t)}</p><div class="mm-bar"><span class="mm-k">${m.k}</span><span class="sp"></span><button class="mm-b ${st.l[m.id]?'on':''}" data-act="mm-like" aria-label="Like" aria-pressed="${!!st.l[m.id]}">${I.heart}</button><button class="mm-b ${st.s[m.id]?'on':''}" data-act="mm-save" aria-label="Save" aria-pressed="${!!st.s[m.id]}">${I.bookmark}</button><button class="mm-b" data-act="mm-share" aria-label="Send to a match">${I.share}</button></div></article>`}
function mmHTML(){return `<section class="mm stg" style="--d:2"><div class="mm-h"><h2 class="sec" style="padding:0">Today’s memes</h2><span class="mm-n">10 fresh</span></div><div class="mm-tabs" role="tablist">${MM_TABS.map(t=>`<button class="chip ${t[0]===mmTab?'on':''}" data-act="mm-tab" data-v="${t[0]}" aria-pressed="${t[0]===mmTab}">${t[1]}</button>`).join('')}</div><div class="mm-row" id="mmrow">${mmList().map(mmCard).join('')}</div></section>`}
ACT['mm-tab']=b=>{mmTab=b.dataset.v;$$('.mm-tabs .chip').forEach(c=>{const on=c===b;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)});const r=$('#mmrow');r.innerHTML=mmList().map(mmCard).join('');r.scrollLeft=0;haptic(5)};
const mmId=b=>b.closest('[data-m]').dataset.m;
ACT['mm-like']=b=>{const id=mmId(b),st=mmS();st.l[id]=st.l[id]?0:1;b.classList.toggle('on',!!st.l[id]);b.setAttribute('aria-pressed',!!st.l[id]);save();if(st.l[id]){burst(b,'#ff5d7a');haptic(10)}};
ACT['mm-save']=b=>{const id=mmId(b),st=mmS();st.s[id]=st.s[id]?0:1;b.classList.toggle('on',!!st.s[id]);b.setAttribute('aria-pressed',!!st.s[id]);save();renderYou();toast(st.s[id]?'Pinned to your meme shelf':'Removed from shelf');haptic(8)};
ACT['mm-share']=b=>{
  const id=mmId(b),ids=Object.keys(S.threads||{});
  openSheet(`<h3 class="sh-t">Send to a match</h3>${ids.length?ids.map(pid=>{const p=person(pid);return `<button class="trk" data-act="mm-send" data-id="${id}" data-to="${pid}"><div class="tile">${orb(p,44)}</div><div><b>${esc(p.name)}</b><span>${p.score}% resonance</span></div></button>`}).join(''):'<p class="hint">Match with someone first, then send them a meme.</p>'}`);
};
ACT['mm-send']=b=>{const pid=b.dataset.to;ensureThread(pid);S.threads[pid].msgs.push({f:'me',kind:'meme',ref:b.dataset.id,ts:Date.now()});save();closeSheet();toast('Sent to '+person(pid).name);haptic(8);reply(pid)};
function memeBub(m){const x=mmOf(m.ref);return x?`<div class="bub-m ${m.f}" style="--bg:${x.bg};--fg:${x.fg}"><span>${x.e}</span>${mmTxt(x.t)}</div>`:''}
ACT['meme-pick']=()=>openSheet(`<h3 class="sh-t">Send a meme</h3><div class="mm-grid">${MM.map(m=>`<button class="mm-mini" data-act="mm-chat" data-id="${m.id}" style="--bg:${m.bg};--fg:${m.fg}"><span>${m.e}</span><i>${esc(m.t.split('\n')[0])}</i></button>`).join('')}</div>`);
ACT['mm-chat']=b=>{const id=threadId();if(!id)return;S.threads[id].msgs.push({f:'me',kind:'meme',ref:b.dataset.id,ts:Date.now()});save();closeSheet();renderMsgs(id);haptic(8);reply(id)};
function mmShelf(){const st=mmS(),ids=MM.filter(m=>st.s[m.id]);return `<div class="blk stg" style="--d:5"><h2>Meme shelf</h2><div class="mm-shelf">${ids.length?ids.map(m=>`<div class="mm-mini sh" style="--bg:${m.bg};--fg:${m.fg}"><span>${m.e}</span><i>${esc(m.t.split('\n')[0])}</i></div>`).join(''):'<p class="hint">Save memes from Today’s memes and they pin here.</p>'}</div></div>`}
/* ================= boot ================= */
function renderAll(){renderFeed();renderMatchShell();renderPeople();renderYou();updateBadge()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f)f(a,e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cc-art')){e.preventDefault();ACT['open-d'](e.target)}});
function splashInit(){
  $('#spfp').innerHTML=fpSVG(fpParams(7),'#EFE9DA','#ff8a5b',{n:16,w:1.3});
  $('#spw').innerHTML=[...'cultured'].map((c,i)=>`<span><i style="--d:${i}">${c}</i></span>`).join('');
  setTimeout(()=>{const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),1000)},2300);
}
function init(){
  grainInit();applyCalm();buildNav();splashInit();
  initPTR();renderAll();go('feed');
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layoutTabs(document));
  window.addEventListener('resize',()=>layoutTabs(document));
  track('app_open',{v:4});if(!S.onboarded)showOnboarding();
}
init();
})();
</script>
</body>
</html>
